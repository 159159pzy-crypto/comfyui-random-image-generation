[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-random-studio"
version = "0.7.0"
description = "基于 ComfyUI 与 Anima Tools 的本地随机生图工作台"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # aiohttp 4 将移除当前使用的字符串 app key 等 API,先锁定在 3.x
    "aiohttp>=3.9,<4",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["anima_webui*", "anima_natural*", "anima_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
