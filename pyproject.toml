[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-random-webui"
version = "0.1.1"
description = "Anima Random WebUI：独立的本地五池随机生图工作台"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # Include the 3.14.4 resource-limit fixes and 3.14.5 WebSocket regression fix.
    "aiohttp>=3.14.5,<4",
    # GHSA-54p9-h82j-f925: items-view reference leak in 6.7.0 through 6.9.0.
    "multidict>=6.9.1,<7",
    "Pillow>=13.0,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15,<0.16",
    "setuptools>=68",
]

[tool.setuptools.packages.find]
include = ["anima_webui*"]

[tool.setuptools.package-data]
"anima_webui" = ["zh_names.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
