[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-random-studio"
version = "0.2.0"
description = "基于 ComfyUI 与 Anima Tools 的本地随机生图工作台"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # aiohttp 4 将移除当前使用的字符串 app key 等 API,先锁定在 3.x
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["anima_webui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
