name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q

      - name: Lint Python
        run: python -m ruff check anima_webui anima_natural anima_studio tests tools --exclude anima_natural/upstream --select E4,E7,E9,F

      - name: Lint V6 modules
        run: python -m ruff check anima_webui/v6_routes.py tests/test_v6_routes.py --select E4,E7,E9,F,I,UP

      - name: Check frontend syntax
        run: node -e "const fs=require('fs'),cp=require('child_process'); for (const file of ['static/app.js','static/natural.js',...fs.readdirSync('static/js').filter(x=>x.endsWith('.js')).map(x=>'static/js/'+x)]) cp.execFileSync(process.execPath,['--check',file],{stdio:'inherit'});"

      - name: Byte-compile sources
        run: python -m compileall -q anima_webui anima_natural anima_studio tests tools run.py generate_templates.py

      - name: Enforce V7 native runtime boundary
        run: python tools/check_v7_native.py

      - name: Test V7 release gate fixtures
        run: python -m pytest -q tests/test_v7_native_gate.py

      - name: Validate workflow templates
        run: python -c "import json; json.load(open('templates/workflow_api.json', encoding='utf-8')); json.load(open('templates/workflow_ui.json', encoding='utf-8'))"
