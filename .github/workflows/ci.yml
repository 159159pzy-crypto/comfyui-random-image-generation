name: Cross-platform quality gates

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Check release metadata, lint, all scripts and regression tests
        run: python scripts/check_release.py
      - name: Audit pinned runtime dependencies
        if: runner.os == 'Linux' && matrix.python == '3.11'
        run: |
          python -m pip install pip-audit
          python scripts/audit_dependencies.py --output output/runtime-dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.python == '3.11' && always()
        with:
          name: runtime-dependency-audit
          path: output/runtime-dependency-audit.json
  source-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install audit tooling
        run: python -m pip install pip-audit
      - name: Audit source runtime including transitive dependencies
        run: python scripts/audit_dependencies.py --source --output source-dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-dependency-audit
          path: source-dependency-audit.json
