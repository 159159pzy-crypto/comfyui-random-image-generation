name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q

      - name: Check frontend syntax
        run: node --check static/app.js

      - name: Byte-compile sources
        run: python -m compileall -q anima_webui tests run.py generate_templates.py

      - name: Validate workflow templates
        run: python -c "import json; json.load(open('templates/workflow_api.json', encoding='utf-8')); json.load(open('templates/workflow_ui.json', encoding='utf-8'))"
