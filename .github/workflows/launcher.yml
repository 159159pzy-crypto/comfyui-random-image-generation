name: Windows launcher
on:
  push:
    branches: ['**']
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python launcher/scripts/export_model_profiles.py --check
      - run: python launcher/scripts/test_bundle_manifest.py
      - name: Audit launcher dependencies
        shell: pwsh
        run: |
          dotnet restore launcher/Anima.Launcher.WinUI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet list launcher/Anima.Launcher.WinUI package --vulnerable --include-transitive --format json > nuget-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = Get-Content nuget-audit.json -Raw | ConvertFrom-Json
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package.vulnerabilities.Count -gt 0) { throw "Vulnerable NuGet dependency: $($package.id)" }
              }
            }
          }
          Remove-Item -LiteralPath nuget-audit.json
      - run: dotnet run -c Release --project launcher/Anima.Launcher.Tests
        env:
          ANIMA_LAUNCHER_TEST_ROOT: ${{ runner.temp }}/anima-launcher-tests
      - name: Verify package integrity checks
        shell: pwsh
        run: ./launcher/scripts/Test-LauncherPackage.ps1
      - name: Publish unsigned candidate
        shell: pwsh
        run: ./Build-Launcher.ps1 -RequireClean -CandidateDirectory '${{ github.workspace }}/dist/ci-candidate'
      - name: Verify candidate ZIP and provenance
        shell: pwsh
        run: ./launcher/scripts/Test-LauncherCandidate.ps1 -CandidateDirectory '${{ github.workspace }}/dist/ci-candidate' -ExpectedCommit '${{ github.sha }}' -RequireClean
      - name: Verify isolated per-user installation, repair and uninstall
        shell: pwsh
        run: ./launcher/scripts/Test-LauncherInstaller.ps1 -CandidateDirectory '${{ github.workspace }}/dist/ci-candidate'
      - name: Retain isolated installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-diagnostics
          if-no-files-found: ignore
          path: output/launcher-installer-tests/**/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: AnimaRandomStudio-win-x64
          if-no-files-found: error
          path: |
            dist/ci-candidate/AnimaRandomStudio.exe
            dist/ci-candidate/AnimaRandomStudio-Setup-win-x64.exe
            dist/ci-candidate/AnimaRandomStudio-portable-win-x64.zip
            dist/ci-candidate/SHA256SUMS.txt
            dist/ci-candidate/build-info.json
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AnimaRandomStudio-win-x64
          path: dist/release
      - name: Verify and publish the complete ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $version = [System.IO.File]::ReadAllText('launcher/version.txt').Trim()
          if ($env:RELEASE_TAG -notin @($version, "v$version")) { throw 'Tag must match launcher/version.txt.' }
          ./launcher/scripts/Test-LauncherCandidate.ps1 -CandidateDirectory dist/release -ExpectedCommit $env:RELEASE_SHA -ExpectedVersion $version -RequireClean
          gh release create $env:RELEASE_TAG --verify-tag --draft --title $version --notes-file RELEASE_NOTES.md dist/release/AnimaRandomStudio.exe dist/release/AnimaRandomStudio-Setup-win-x64.exe dist/release/AnimaRandomStudio-portable-win-x64.zip dist/release/SHA256SUMS.txt dist/release/build-info.json
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing assets were not overwritten.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Assets are uploaded as a draft; publishing the release failed.' }
